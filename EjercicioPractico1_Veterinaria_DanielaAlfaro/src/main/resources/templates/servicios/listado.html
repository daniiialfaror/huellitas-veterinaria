<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servicios veterinarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-success mb-4">Servicios veterinarios</h1>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <a th:href="@{/servicios/nuevo}" class="btn btn-success mb-3">
        Agregar servicio
    </a>
    <table class="table table-bordered table-striped bg-white">
        <thead class="table-success">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Duración (minutos)</th>
                <th>Tipo de servicio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="servicio : ${servicios}">
                <td th:text="${servicio.id}"></td>
                <td th:text="${servicio.nombre}"></td>
                <td th:text="${servicio.precio}"></td>
                <td th:text="${servicio.duracionMinutos}"></td>
                <td th:text="${servicio.tipoServicio != null ? servicio.tipoServicio.nombre : 'Sin tipo'}"></td>
                <td>
                    <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>
                    <button type="button"
                            class="btn btn-danger btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#modalEliminar"
                            th:attr="data-id=${servicio.id},data-nombre=${servicio.nombre}">
                        Eliminar
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(servicios)}">
                <td colspan="6" class="text-center">
                    No hay servicios registrados.
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
</div>
<!-- Modal de confirmación -->
<div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Deseás eliminar el servicio
                <strong id="nombreServicio"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <a id="botonEliminar" href="#" class="btn btn-danger">
                    Sí, eliminar
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modalEliminar = document.getElementById('modalEliminar');
    modalEliminar.addEventListener('show.bs.modal', function (event) {
        const boton = event.relatedTarget;
        const id = boton.getAttribute('data-id');
        const nombre = boton.getAttribute('data-nombre');
        document.getElementById('nombreServicio').textContent = nombre;
        document.getElementById('botonEliminar').href =
            '/servicios/eliminar/' + id;
    });
</script>
</body>
</html>
