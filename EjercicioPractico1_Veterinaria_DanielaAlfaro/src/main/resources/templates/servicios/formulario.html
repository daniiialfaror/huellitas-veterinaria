<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h2>Servicio veterinario</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/servicios/guardar}"
                  th:object="${servicio}"
                  method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del servicio:</label>
                    <input type="text" id="nombre" th:field="*{nombre}"
                           class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="precio" class="form-label">Precio:</label>
                    <input type="number" id="precio" th:field="*{precio}"
                           class="form-control" min="0" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label for="duracionMinutos" class="form-label">
                        Duración en minutos:
                    </label>
                    <input type="number" id="duracionMinutos"
                           th:field="*{duracionMinutos}"
                           class="form-control" min="1" required>
                </div>
                <div class="mb-3">
                    <label for="tipoServicio" class="form-label">
                        Tipo de servicio:
                    </label>
                    <select id="tipoServicio" name="tipoServicio.id"
                            class="form-select" required>
                        <option value="">Seleccione un tipo</option>
                        <option th:each="tipo : ${tiposServicio}"
                                th:value="${tipo.id}"
                                th:text="${tipo.nombre}"
                                th:selected="${servicio.tipoServicio != null and servicio.tipoServicio.id == tipo.id}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/servicios}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
