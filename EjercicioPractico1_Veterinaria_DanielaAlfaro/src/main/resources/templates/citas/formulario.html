<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agendar cita | Huellitas Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f3faf7;
            font-family: Arial, sans-serif;
        }
        .encabezado {
            background-color: #176b58;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .formulario {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .btn-verde {
            background-color: #176b58;
            color: white;
        }
        .btn-verde:hover {
            background-color: #10503f;
            color: white;
        }
    </style>
</head>
<body>
<header class="encabezado">
    <h1>🐾 Huellitas Veterinaria</h1>
    <p class="mb-0">Agendá una cita para tu mascota</p>
</header>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="formulario">
                <h2 class="mb-4">Nueva cita veterinaria</h2>
                <form th:action="@{/citas/guardar}" method="post">
                    <div class="mb-3">
                        <label for="nombreMascota" class="form-label">
                            Nombre de la mascota
                        </label>
                        <input type="text" class="form-control"
                               id="nombreMascota" name="nombreMascota"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="nombrePropietario" class="form-label">
                            Nombre del propietario
                        </label>
                        <input type="text" class="form-control"
                               id="nombrePropietario" name="nombrePropietario"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="fecha" class="form-label">
                            Fecha de la cita
                        </label>
                        <input type="date" class="form-control"
                               id="fecha" name="fecha"
                               th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                               required>
                    </div>
                    <div class="mb-4">
                        <label for="servicioId" class="form-label">
                            Servicio veterinario
                        </label>
                        <select class="form-select" id="servicioId"
                                name="servicioId" required>
                            <option value="">Seleccione un servicio</option>
                            <option th:each="servicio : ${servicios}"
                                    th:value="${servicio.id}"
                                    th:text="${servicio.nombre}">
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-verde w-100">
                        Agendar cita
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a th:href="@{/citas}" class="text-success">
                        Ver citas registradas
                    </a>
                    <br>
                    <a th:href="@{/}" class="text-secondary">
                        Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
