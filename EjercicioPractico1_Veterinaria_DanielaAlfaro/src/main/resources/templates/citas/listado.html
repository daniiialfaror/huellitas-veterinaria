<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Citas veterinarias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f3faf7;">
<div class="container mt-5">
    <h1 class="mb-4">Citas registradas</h1>
    <a th:href="@{/citas/nueva}" class="btn btn-success mb-3">
        Agendar nueva cita
    </a>
    <a th:href="@{/}" class="btn btn-secondary mb-3">
        Volver al inicio
    </a>
    <table class="table table-bordered table-striped">
        <thead class="table-success">
            <tr>
                <th>Mascota</th>
                <th>Propietario</th>
                <th>Fecha</th>
                <th>Servicio</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.nombreMascota}"></td>
                <td th:text="${cita.nombrePropietario}"></td>
                <td th:text="${cita.fecha}"></td>
                <td th:text="${cita.servicio != null ? cita.servicio.nombre : 'Sin servicio'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="4" class="text-center">
                    Todavía no hay citas registradas.
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
